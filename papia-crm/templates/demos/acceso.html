<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ titulo }}</title>
  <meta property="og:title" content="{{ titulo }}">
  <meta property="og:description" content="Demo preparado por PapiaTech.">
  <style>
    :root { color-scheme: light dark; --bg:#f6f5f2; --card:#fff; --ink:#151515; --muted:#6b6b6b; --line:#e6e3dc; --accent:#C9A84C; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1b1b1b; --ink:#f2f2f2; --muted:#a3a3a3; --line:#2b2b2b; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
           border-radius:14px; padding:28px 24px; text-align:center; }
    .brand { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; }
    h1 { font-size:20px; margin:10px 0 6px; }
    p { color:var(--muted); margin:0; }
    a.btn { display:inline-block; margin-top:20px; padding:10px 18px; border-radius:10px;
            background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <div class="brand">PapiaTech</div>
    <h1>{{ titulo }}</h1>
    <p>{{ texto }}</p>
    {% if wa %}<a class="btn" href="{{ wa }}" rel="noopener">Escribir por WhatsApp</a>{% endif %}
  </main>
</body>
</html>
