<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Papia CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Geist', sans-serif;
      background: #0B0E14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }

    .login-logo img {
      height: 32px;
      object-fit: contain;
    }

    .login-card {
      background: #13171F;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 32px;
    }

    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #F5F0EB;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: rgba(255,255,255,.4);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.5);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.25);
      font-size: 14px;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 34px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      color: #F5F0EB;
      font-family: 'Geist', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .14s ease, box-shadow .14s ease;
    }

    .field input::placeholder { color: rgba(255,255,255,.2); }

    .field input:focus {
      border-color: #2A5BFF;
      box-shadow: 0 0 0 3px rgba(42,91,255,.18);
      background: rgba(42,91,255,.06);
    }

    .error-msg {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(220,38,38,.3);
      border-radius: 8px;
      color: #F87171;
      font-size: 13px;
      padding: 9px 12px;
      margin-bottom: 18px;
    }

    .btn-login {
      width: 100%;
      height: 40px;
      background: #2A5BFF;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Geist', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .14s ease, transform .1s ease;
      margin-top: 4px;
    }

    .btn-login:hover { background: #1A4AEF; }
    .btn-login:active { transform: scale(.98); }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,.18);
    }
    .login-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0 14px; color: rgba(255,255,255,.35); font-size: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.10);
    }
    .btn-google {
      width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1F1F1F; border: 1px solid #DADCE0; border-radius: 8px;
      font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 600; text-decoration: none;
      transition: background .14s ease, transform .1s ease;
    }
    .btn-google:hover { background: #F2F4F7; }
    .btn-google:active { transform: scale(.98); }
    .btn-google svg { width: 18px; height: 18px; }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">
    <img src="https://www.papiatech.com/assets/logo-papiatech-white-CnoB7BBt.png" alt="Papia Tech" />
  </div>

  <div class="login-card">
    <div class="login-title">Bienvenido</div>
    <div class="login-sub">Ingresa tus credenciales para continuar</div>

    {% if error %}
      <div class="error-msg">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" autocomplete="on">
      <div class="field">
        <label for="username">Usuario</label>
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="admin"
            autocomplete="username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <div class="login-divider">o</div>

    <a class="btn-google" href="{{ url_for('auth.google_login', next=request.args.get('next', '')) }}">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continuar con Google
    </a>
  </div>

  <div class="login-footer">Papia Technology Solutions LLC &copy; 2025</div>

</div>

</body>
</html>
