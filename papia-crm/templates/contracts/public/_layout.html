<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{% block title %}Papia Sign{% endblock %} — {{ org_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500&family=Dancing+Script:wght@500&family=Homemade+Apple&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/contracts_public.css') }}?v=1" rel="stylesheet" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="ps-top">
    <div class="ps-brand">
      <span class="ps-logo" aria-hidden="true">{{ (org_name or 'P')[0] }}</span>
      <div>
        <div class="ps-org">{{ org_name }}</div>
        <div class="ps-sub">{% block subtitle %}Firma electrónica segura{% endblock %}</div>
      </div>
    </div>
    <div class="ps-secure"><i class="bi bi-shield-lock-fill"></i> Conexión cifrada · Papia Sign</div>
  </header>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
